l_french:
 oligarchic_elective_succession_law: "Élective oligarchique"
 oligarchic_elective_succession_law_effects: "Le [ruler|E] et tous les [powerful_vassals|E] du domaine peuvent désigner un [title_heir|E] parmi eux-mêmes et la [close_family|E] du dirigeant."
 oligarchic_elective_candidates: "Famille proche et électeurs"
 oligarchic_elective_candidates_tooltip:1 "Pour être un candidat valide sous l'Élective oligarchique, un personnage doit remplir l'une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [close_family|E] du dirigeant actuel, qui n'est pas appelé à hériter d'une Théocratie ou d'une République. Les enfants d'un candidat ne peuvent être désignés\n$EFFECT_LIST_BULLET$Être un [elector|E] oligarchique valide du titre"
 oligarchic_elective_electors:0 "$feudal_elective_electors$"
 oligarchic_elective_electors_tooltip:1 "Pour être un [elector|E] valide sous l'Élective oligarchique, un personnage doit remplir l'une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être le détenteur actuel du titre\n$EFFECT_LIST_BULLET$Être un [powerful_vassal|E] qui est un vassal direct du titre"
 tooltip_peasant_elective_development:2 "Total [development|E], modifié par [county_opinion|E] : $VALUE|=+0$"
 tooltip_peasant_elector_vote:0 "Opinion populaire de la capitale : $VALUE|=+0$"
 tooltip_theocratic_vote_strength_title_tier:2 "[ROOT.Char.GetSheHe|U] est le [ROOT.Char.GetTitleTierName] : $VALUE|=+0$"
 tooltip_theocratic_vote_strength_piety:2 "Niveau de dévotion : $VALUE|=+0$"
 tooltip_theocratic_vote_strength_virtues:2 "Péchés et vertus : $VALUE|=+0$"
 peasant_elective_succession_law:1 "Élective populiste"
 peasant_elective_succession_law_subname:0 "Paysanne"
 peasant_elective_succession_law_effects:2 "Le [ruler|E] et tous les [vassals|E] directs (sauf les barons) peuvent désigner un [title_heir|E] parmi eux-mêmes et la [close_family|E] du dirigeant. Le [voting_power|E] dans cette [succession_law|E] est influencé par le [domain|E], le [county_development|E] et le [county_opinion|E] totaux de l'[elector|E]. Les électeurs favoriseront les candidats ayant une forte [county_opinion|E] dans la [capital|E]."
 peasant_elective_candidates:0 "Famille proche, prétendants et électeurs"
 peasant_elective_candidates_tooltip:1 "Pour être un candidat valide sous l'Élective populiste, un personnage doit remplir l'une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [close_family|E] du dirigeant actuel, qui n'est pas appelé à hériter d'une Théocratie ou d'une République. Les enfants d'un candidat ne peuvent être désignés\n$EFFECT_LIST_BULLET$Être un [claimant|E] du titre, qui n'est pas appelé à hériter d'une République\n$EFFECT_LIST_BULLET$Être un [elector|E] populiste valide du titre"
 peasant_elective_electors:0 "Dirigeant et vassaux"
 peasant_elective_electors_tooltip:0 "Pour être un [elector|E] valide sous l'Élective populiste, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal direct du titre\n$EFFECT_LIST_BULLET$Être au-dessus du [rank|E] de [baron|E]."
 skone_theocratic_elective_succession_law:1 "Élective théocratique"
 skone_theocratic_elective_succession_law_effects:2 "Tous les [vassals|E] [de_jure|E] peuvent désigner un [title_heir|E] parmi eux-mêmes, la [close_family|E] du dirigeant et les [claimant|E]s. Le [voting_power|E] dans cette [succession_law|E] est influencé par le [title_tier|E], le [piety_level|E] et les [traits|E] [virtuous|E] de l'[elector|E]. Les électeurs favoriseront les candidats ayant un [piety_level|E] élevé et des [traits|E] [virtuous|E]."
 skone_theocratic_elective_candidates:0 "Famille proche, prétendants et vassaux de jure"
 skone_theocratic_elective_candidates_tooltip:1 "Pour être un candidat valide sous l'Élective théocratique, un personnage doit remplir l'une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [close_family|E] du dirigeant actuel, qui n'est pas appelé à hériter d'une République. Les enfants d'un candidat ne peuvent être désignés\n$EFFECT_LIST_BULLET$Être un [claimant|E] du titre, qui n'est pas appelé à hériter d'une République\n$EFFECT_LIST_BULLET$Être un [vassal|E] [de_jure|E] du titre"
 skone_theocratic_elective_electors:0 "Vassaux de jure"
 skone_theocratic_elective_electors_tooltip:0 "Pour être un [elector|E] valide sous l'Élective théocratique, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un [vassal|E] [de_jure|E] du titre\n$EFFECT_LIST_BULLET$Être un comte ou d'un rang supérieur."
