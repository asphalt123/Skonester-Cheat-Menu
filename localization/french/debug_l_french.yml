se_data_calc_cancer_premature_death_chance').GetValue]%\nchance de contracter la maladie vénérienne : [ROOT.Var('disease_data_calc_lovers_pox_percentage').GetValue]%\nchance de mort prématurée (maladie vénérienne) : [ROOT.Var('disease_data_calc_lovers_pox_premature_death_chance').GetValue]%\nchance de contracter la grande vérole : [ROOT.Var('disease_data_calc_great_pox_percentage').GetValue]%\nchance de mort prématurée (grande vérole) : [ROOT.Var('disease_data_calc_great_pox_premature_death_chance').GetValue]%\nchance de contracter la variole : [ROOT.Var('disease_data_calc_smallpox_percentage').GetValue]%\nchance de mort prématurée (variole) : [ROOT.Var('disease_data_calc_smallpox_premature_death_chance').GetValue]%\nchance de contracter la peste bubonique : [ROOT.Var('disease_data_calc_bubonic_plague_percentage').GetValue]%\nchance de mort prématurée (peste bubonique) : [ROOT.Var('disease_data_calc_bubonic_plague_premature_death_chance').GetValue]%\n\nhej[a_value.GetName]hey"

