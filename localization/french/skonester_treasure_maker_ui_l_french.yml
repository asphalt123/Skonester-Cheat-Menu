 skonester_treasure_maker.3999.t: "Création terminée"

 skonester_treasure_maker.3999.desc: "Votre artefact a été fabriqué selon vos choix. La propriété suit la règle de destinataire sélectionnée. Tous les réglages de l'atelier ont été réinitialisés, prêts pour une nouvelle création."



 skonester_treasure_maker_workshop: "Atelier d'artefacts"

 skonester_treasure_maker_workshop_desc: "Ouvrez l'atelier d'artefacts. Ajustez les paliers de 25 attributs, activez de puissants ensembles de modificateurs, choisissez le type et la qualité, puis fabriquez des artefacts de style Royal Court."



 skonester_tm_artifact_name: "Forge merveilleuse"

 skonester_tm_artifact_desc: "Forgé au sein de l'atelier d'artefacts. Ses bénédictions poussent la puissance mortelle à des hauteurs extraordinaires."

