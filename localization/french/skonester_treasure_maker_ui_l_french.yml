 skonester_treasure_maker.2000.t: "Ensembles de modificateurs puissants"

 skonester_treasure_maker.2000.desc: "Cliquez pour activer ou désactiver chaque ensemble. Ce sont des effets puissants mais légitimes ; ils n'accordent ni véritable immortalité ni assassinats instantanés."

