 skonester_treasure_maker.0001.t: "Atelier d'artefacts"

 skonester_treasure_maker.0001.desc: "Ajustez les paliers de 25 attributs et de puissants ensembles de modificateurs. Choisissez la forme et la qualité de l'artefact, puis fabriquez votre objet. Lorsque « Octroyer à la cible » est activé, l'artefact sera remis au personnage sur lequel vous avez cliqué droit.\nCK3 ne prend pas en charge les curseurs, ce menu utilise donc une navigation par événements. Les noms et descriptions d'artefacts reposent sur des entrées de localisation fixes."

