### CONVERT TO NOMAD
 ch_convert_holding_to_nomad_decision:0 "Convertir le territoire en Camp nomade"
 ch_convert_holding_to_nomad_decision_tooltip:0 "Le ou les territoires existants seront remplacés par une installation [nomad_holding|E]"
 ch_convert_holding_to_nomad_title:0 "Convertir le territoire en Camp nomade" 
 ch_convert_holding_to_nomad_tt:0 "Convertit le territoire principal d'une baronnie." 
 ch_convert_holding_to_nomad_desc:0 "#F Les besoins du peuple ont changé, imposant une mutation de la fonction première de cette installation. Une nouvelle méthode de construction privilégiera la mobilité et la prouesse militaire.#!"
 ch_convert_holding_to_nomad_decision_confirm:0 "Convertir le territoire en nomade"
 ch_convert_holding_to_nomad_decision_effect_message:0 "Le territoire a été converti en Camp nomade."
 has_ch_eligble_barony_to_nomad_in_county:1 "Vous avez une [barony|E] avec un [holding|E] pouvant être converti en Installation nomade\n$EFFECT_LIST_BULLET$Seuls les territoires des [counties|E] dont vous êtes personnellement le [holder|E] sont éligibles\n$EFFECT_LIST_BULLET$Les territoires avec des constructions en cours ne sont #bold pas#! éligibles\n$EFFECT_LIST_BULLET$Malgré ce que peut vous dire la fenêtre Sélectionner un territoire, vous #bold pouvez#! bel et bien sélectionner une [county_capital|E]"

