 ### --- X Decisions ---
 X1_decision_title:0 "Embrasser la voie valeureuse"
 X1_decision_desc:0 "La voix de l'honneur et de la chevalerie m'appelle. Par ce choix, mon nom sera chanté comme chevaleresque et véritable."
 X1_decision_confirm:0 "Que ma valeur soit ainsi prouvée."

 X_build_title:0 "Entreprendre de grands travaux"
 X_build_desc:0 "Les champs sont en friche et le peuple réclame pain et abri. Par de tels labeurs de pierre et de bois, mon domaine sera renforcé."
 X_build_confirm:0 "Convoquez les maçons et les intendants."

 X_city_title:0 "Fonder un bourg"
 X_city_desc:0 "Là où s'étendent la nature sauvage et les hameaux, j'érigerai un bourg de commerce et d'artisanat. Les marchands afflueront et les guildes prospéreront sous ma bannière."
 X_city_confirm:0 "Que le bourg soit fondé."

 X_temple_title:0 "Élever une maison sainte"
 X_temple_desc:0 "Les fidèles aspirent à un lieu de culte où la cloche et la prière s'élèveront vers le ciel. Par mon ordre, un temple s'élèvera."
 X_temple_confirm:0 "Consacrez le sol."

 X_castle_title:0 "Fortifier d'un château"
 X_castle_desc:0 "Rien ne garantit le règne d'un seigneur plus vite que des murs de pierre. Un donjon s'élèvera, bastion de puissance et siège de ma maison."
 X_castle_confirm:0 "Élevez la forteresse."

 X_unify_title:0 "Unir le domaine dans la foi et la coutume"
 X_unify_desc:0 "Mes vassaux diffèrent par la langue et la croyance, déchirés par la coutume et la prière. Pourtant, sous une seule bannière, le sang et l'esprit seront réunis."
 X_unify_confirm:0 "Ramenez le domaine à une seule foi et coutume."
