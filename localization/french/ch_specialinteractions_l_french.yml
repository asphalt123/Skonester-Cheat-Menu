 ch_convert_holding_to_castle_decision_desc:0 "#F Des architectes et des ingénieurs se rassemblent dans mon domaine ces derniers temps. Beaucoup sont recherchés comme maîtres bâtisseurs, mais pour prouver leur talent, ils veulent de grands projets à réaliser.#!"
 ch_convert_holding_to_castle_decision_confirm:0 "Convertir le territoire en Château"
 I_HAVE_CH_ELIGBLE_BARONIES_TO_CASTLE_COUNTY:1 "Vous avez une [barony|E] avec un [holding|E] pouvant être converti en [castle|E]\n$EFFECT_LIST_BULLET$Seuls les territoires des [counties|E] dont vous êtes personnellement le [holder|E] sont éligibles\n$EFFECT_LIST_BULLET$Les territoires avec des constructions en cours ne sont #bold pas#! éligibles\n$EFFECT_LIST_BULLET$Malgré ce que peut vous dire la fenêtre Sélectionner un territoire, vous #bold pouvez#! bel et bien sélectionner une [county_capital|E]\n$EFFECT_LIST_BULLET$Si vous convertissez un [temple|E], vous devrez peut-être attendre que votre [realm_priest|E] abandonne automatiquement le [holding|E]"

