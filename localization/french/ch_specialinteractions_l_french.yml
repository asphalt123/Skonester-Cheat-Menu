### CONVERT TO TEMPLE CITADEL
 ch_convert_holding_to_temple_citadel_decision:0 "Convertir le territoire en Citadelle-temple"
 ch_convert_holding_to_temple_citadel_tooltip:0 "Le ou les territoires existants seront remplacés par un territoire-citadelle [temple|E]"
 ch_convert_holding_to_temple_citadel_title:0 "Convertir le territoire en Citadelle-temple"
 ch_convert_holding_to_temple_citadel_tt:0 "Convertit le territoire principal d'une baronnie." 
 ch_convert_holding_to_temple_citadel_desc:0 "#F Une grande entreprise spirituelle est nécessaire pour affermir la foi dans cette région. Nous devons consacrer cette terre au divin, en bâtissant un lieu à la fois sacré et imprenable.#!"
