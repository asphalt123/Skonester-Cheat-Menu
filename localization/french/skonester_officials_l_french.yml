 skonester_officials.9084.t: "Règle de l'enfant unique et protection dynastique"
 skonester_officials.9084.desc: "#bold Règle de l'enfant unique#! : s'applique à tous les pères IA. Jugée selon le nombre d'enfants vivants — si le père a déjà 1 enfant vivant, le nouveau-né est éliminé. Les enfants morts ne comptent pas ; après la mort de l'unique enfant vivant, un autre enfant peut être conservé. Seuls les enfants IA de pères IA sont éliminés ; les pères joueurs humains en sont exemptés. La protection dynastique optionnelle exclut la dynastie du joueur. Mutuellement exclusive avec la Restriction d'enfant unique pour les hommes de la dynastie."
 skonester_officials.9084.enable: "Activer la règle de l'enfant unique"
 skonester_officials.9084.disable: "Désactiver la règle de l'enfant unique"
 skonester_officials.9084.exempt_dynasty_on: "Exempter la dynastie du joueur"
 skonester_officials.9084.exempt_dynasty_off: "Révoquer l'exemption dynastique"

 skonester_officials.9087.t: "Restriction d'enfant unique pour les hommes de la dynastie"
 skonester_officials.9087.desc: "#bold Au sein de votre [dynasty|E], chaque homme IA ne peut avoir au plus qu'un enfant vivant#!. Jugée uniquement selon le nombre d'enfants vivants : si le père a déjà 1 enfant vivant, le nouveau-né est éliminé. Les enfants morts ne comptent pas — après la mort de l'unique enfant vivant, un autre enfant peut être conservé. S'applique uniquement aux dynasties comptant un personnage joueur humain actif. Si la Règle de l'enfant unique standard est également active, les dynasties de joueurs suivent d'abord cette restriction. #bold Ne s'applique pas#! lorsque le père biologique est un joueur humain. Sans effet lorsque désactivée."
 skonester_officials.9087.enable: "Activer la limite d'enfant unique pour les hommes de la dynastie"
 skonester_officials.9087.disable: "Désactiver la limite d'enfant unique pour les hommes de la dynastie"

