 skonester_tt_has_anyone_to_purge_fail: "Aucune cible éligible trouvée. Nécessite des gouverneurs incompétents ou des nobles possessionnés détenant des titres principaux de rang correspondant, ayant aussi un héritier désigné — héritier principal, héritier joueur ou tout héritier vivant (y compris les héritiers générés via l'Administration provinciale)."
