 skonester_cheat_menu_force_pregnancy_interaction: "Forcer la grossesse"
 skonester_cheat_menu_force_pregnancy_interaction_desc: "Ciblez n'importe quel personnage féminin vivant autre que vous-même. Si elle n'est ni votre conjointe, amante, âme sœur ou concubine, elle tombera enceinte avec vous comme père biologique. Cette grossesse sera traitée comme un bâtard inconnu, son conjoint actuel étant indiqué comme père présumé s'il existe, ce qui réduit le risque de révélation d'adultère. Si elle est votre conjointe, amante, âme sœur ou concubine, vous serez indiqué comme père biologique et présumé. Cette action ignore les restrictions de fertilité et ne créera pas de relations d'amants ni de secrets d'adultère. Les mineurs et les personnages ne pouvant pas tomber enceints ne seront pas affectés."
 skonester_cheat_menu_pregnancy_manage_interaction: "Gestion de la grossesse"
 skonester_cheat_menu_pregnancy_manage_interaction_desc: "Modifier l'état de grossesse du personnage cible."
 skonester_cheat_menu_relation_confirm_interaction: "Vérifier la relation familiale"
 skonester_cheat_menu_relation_confirm_interaction_desc: "Confirmer les liens familiaux existants entre personnages."
 skonester_cheat_menu_add_concubine_interaction: "Prendre une concubine"
 skonester_cheat_menu_add_concubine_interaction_desc: "Nommer la cible comme votre concubine."
 skonester_cheat_menu_join_court_interaction: "Recruter à la cour"
 skonester_cheat_menu_join_court_interaction_desc: "Forcer un personnage sans terre à rejoindre votre cour."
 skonester_cheat_menu_make_my_vassal_interaction: "Rendre vassal direct"
 skonester_cheat_menu_make_my_vassal_interaction_desc: "Forcer la cible à jurer fidélité et à devenir votre vassal direct. Fonctionne pour tous les dirigeants possessionnés, qu'ils soient IA ou joueur. Sans effet s'ils sont déjà votre vassal direct. Vous et la cible devez tous deux détenir des terres. Le rang de leur titre principal ne peut pas dépasser le vôtre, et ils ne peuvent pas être votre suzerain ni se situer au-dessus de vous dans la chaîne vassalique. Certains types de gouvernement, le statut tributaire et d'autres règles du jeu peuvent encore bloquer cette action."
 skonester_cheat_menu_declare_war_interaction: "Déclarer la guerre"
 skonester_cheat_menu_declare_war_interaction_desc: "Lancer une guerre contre un dirigeant indépendant. Choisissez de les forcer au statut de tributaire ou de conquérir tout leur domaine. Les trêves existantes seront levées au préalable, et aucune nouvelle trêve ne sera créée après la guerre."
 skonester_cheat_menu_war_cb_tributary: "Forcer le statut de tributaire"
 skonester_cheat_menu_war_cb_conquer_realm: "Conquérir tout le domaine"
 skonester_cheat_menu_force_tributary_cb: "Forcer le statut de tributaire"
 skonester_cheat_menu_force_tributary_cb_victory_desc: "[attacker.GetShortUIName|U] force [defender.GetShortUIName|U] à devenir un tributaire."
 skonester_cheat_menu_force_tributary_cb_white_peace_desc: "La guerre se termine sans conclusion ; [defender.GetShortUIName|U] n'est pas forcé au statut de tributaire."
