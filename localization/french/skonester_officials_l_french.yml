 skonester_officials.9083.t: "Éliminer les roturiers sans attaches"
 skonester_officials.9083.desc: "Retirer en toute sécurité les vagabonds IA inutilisés du pool de personnages. La purge ne traite que 25 personnages tous les trois jours et ne cible jamais les courtisans, invités, dirigeants, aventuriers ou votre famille protégée. Une seule purge peut s'exécuter à la fois."
