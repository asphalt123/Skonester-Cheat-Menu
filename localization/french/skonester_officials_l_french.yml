 skonester_decision_open_learn_official_secrets: "Ouvrir l'Inquisition de la Robe de Soie"
 skonester_decision_open_learn_official_secrets_desc: "Ouvrir l'interaction #bold Inquisition de la Robe de Soie#!. Un vassal possessionné sera présélectionné s'il détient des secrets que vous ignorez."
 skonester_decision_open_learn_official_secrets_tooltip: "Au moins un vassal possessionné cache des secrets que vous n'avez pas découverts."
 skonester_decision_open_learn_official_secrets_confirm: "Ouvrir"

 skonester_seduce_blocked_player_consort_tt: "Tant que la Vigile de la chambre intérieure est #bold activée#!, #bold tous les personnages, y compris l'IA#!, ne peuvent pas lancer de [scheme|E] de Séduction contre vos conjoints et concubines. Des exceptions ne s'appliquent que si le conjoint ou son suzerain est l'initiateur ou la cible de la manigance. Chaque jour, toutes les manigances de romance, d'enlèvement et de fuite amoureuse en cours ciblant les membres de la maisonnée sont interrompues, et les liens d'amants entre les membres de la maisonnée et les non-dirigeants sont brisés. Ce paramètre est activé par défaut sur les nouvelles campagnes ; une fois désactivé manuellement, il ne se réactivera plus automatiquement."
 skonester_seduce_blocked_harem_outgoing_tt: "Tant que la Vigile de la chambre intérieure est activée, vos conjoints et concubines #bold ne peuvent pas#! lancer de [scheme|E] de Séduction contre d'autres personnes (y compris l'#bold IA#!), sauf pour vous séduire. La vigile met également fin chaque jour à toutes les manigances de romance, d'enlèvement et de fuite amoureuse vers l'extérieur entamées par vos concubines."

 skonester_learn_all_realm_officials_secrets_decision: "Inquisition à l'échelle du domaine"
 skonester_learn_all_realm_officials_secrets_decision_desc: "Découvrir tous les secrets détenus par les officiels de votre domaine."
 skonester_learn_all_realm_officials_secrets_decision_tooltip: "Nécessite TGP et un gouvernement cadre compatible."
 skonester_learn_all_realm_officials_secrets_decision_confirm: "Enquêter"
 skonester_learn_all_secrets_prestige_cost_desc: "Enquête à l'échelle du domaine"

 skonester_seduce_shield_for_consorts_decision_title_on: "#bold 【ON】#! Vigile de la chambre intérieure"
 skonester_seduce_shield_for_consorts_decision_title_off: "#bold 【OFF】#! Vigile de la chambre intérieure"
 skonester_seduce_shield_for_consorts_decision_desc_on: "La vigile est active. Les étrangers ne peuvent pas séduire vos concubines, et vos concubines ne peuvent pas séduire d'autres personnes (y compris l'IA), sauf vous. Règles universelles : tous les IA sont exclus de la séduction, de la cour et de la fuite amoureuse ; les liens d'amants extraconjugaux des IA mariés sont effacés quotidiennement. Effets quotidiens : rafraîchit les traits Chaste et Loyal ; met fin à toutes les manigances romantiques, d'enlèvement et de fuite amoureuse entrantes et sortantes impliquant votre maisonnée ; retire les liens d'amants vers quiconque autre que vous. Un rafraîchissement annuel des traits sert de sauvegarde supplémentaire. Cliquez pour désactiver."
 skonester_seduce_shield_for_consorts_decision_desc_off: "La vigile est inactive. Les nouvelles campagnes activent la vigile par défaut jusqu'à désactivation manuelle, après quoi elle reste éteinte. Lorsqu'elle est active, les concubines sont protégées de la séduction, les restrictions romantiques globales de l'IA s'appliquent, les manigances hostiles sont effacées quotidiennement et les liens d'amants sans rapport sont retirés. Les traits Chaste et Loyal bénéficient de rafraîchissements quotidiens et annuels."
 skonester_seduce_shield_for_consorts_decision_tooltip_on: "La vigile est active. Cliquez pour désactiver."
 skonester_seduce_shield_for_consorts_decision_tooltip_off: "La vigile est inactive. Cliquez pour activer."
 skonester_seduce_shield_for_consorts_decision_confirm_disable: "Désactiver la vigile"
 skonester_seduce_shield_for_consorts_decision_confirm_enable: "Activer la vigile"

 skonester_bulk_guardian_run_decision: "Attribution en masse des tuteurs"
 skonester_bulk_guardian_run_decision_desc: "Nommez des tuteurs qualifiés pour tous les enfants de votre domaine. Optionnel : exécutez d'abord \"$skonester_court_management_decision$\" afin de disposer de courtisans mieux qualifiés comme tuteurs."
 skonester_bulk_guardian_run_decision_tooltip: "Au moins un pupille est éligible. Réservé aux joueurs humains."
 skonester_bulk_guardian_run_decision_confirm: "Exécuter"
 skonester_bulk_guardian_strip_old_guardians_tt: "Retirer les liens de tutelle obsolètes pour cet enfant, y compris les entrées dupliquées et invalides."
 skonester_bulk_guardian_strip_tutor_other_wards_tt: "Rompre les fonctions de tuteur de ce précepteur envers toutes les autres pupilles existantes."

 skonester_court_management_decision: "Purge et recrutement de la cour"
 skonester_court_management_decision_desc: "Renvoyer les courtisans inutiles (hors membres de la dynastie) et recruter de nouveaux courtisans aux attributs supérieurs."
 skonester_court_management_decision_tooltip: "Réservé aux joueurs humains. Effectue une seule série de purge et de recrutement."
 skonester_court_management_decision_confirm: "Exécuter"
 skonester_court_mgmt_msg_title: "Cour réorganisée"
 skonester_court_mgmt_msg_desc: ""

 skonester_adopted_son_interaction: "Adopter dans la dynastie et la maison"
 skonester_adopted_son_interaction_desc: "Fonction de triche : définissez ce personnage comme votre enfant (père si masculin, mère si féminin) et intégrez-le à votre maison. Retire tous les traits de bâtard. Nécessite que vous apparteniez à une maison noble. Impossible de cibler votre conjoint, vos enfants ou vos parents existants. Si la cible est d'âge égal ou supérieur au vôtre, son âge sera temporairement ajusté pour établir le lien parent-enfant, puis restauré ensuite."
 skonester_cheat_menu_same_house_interaction: "Unir sous votre maison"
 skonester_cheat_menu_same_house_interaction_desc: "Déplacer ce personnage dans votre dynastie et votre maison noble, partageant votre nom de famille. Ne modifie pas la parenté. Nécessite que vous dirigiez une dynastie et une maison. Masqué automatiquement s'ils appartiennent déjà à votre maison."

 skonester_officials.9071.t: "Définir le plafond de revenu par rang"
 skonester_officials.9071.desc: ""

 skonester_foreman_realm_unified_decision: "Surveillants d'intendance : domaine entier"
 skonester_foreman_realm_unified_decision_desc: "Construire intelligemment et maximiser les bâtiments principaux et les emplacements dans chaque comté de votre domaine selon le type de territoire (même résultat que l'ancienne version en une seule image). Pour éviter les ralentissements dans les grands domaines, la construction s'exécute par lots quotidiens (~10 comtés par lot, un lot par jour de jeu) ; cette décision ne peut pas être reprise avant la fin — plus le domaine est grand, plus il faut de jours de jeu."
 skonester_foreman_realm_unified_decision_req_idle: "Aucun lot de construction à l'échelle du domaine n'est en cours"
 skonester_foreman_realm_unified_decision_confirm: "Lancer les surveillants (tous les domaines)"
 skonester_foreman_vassal_unified_interaction: "Surveillants d'intendance : démense cible"
 skonester_foreman_vassal_unified_interaction_desc: ""

 skonester_world_ai_boost_pause_decision: "Mettre en pause les bonus de domaine globaux de l'IA"
 skonester_world_ai_boost_pause_decision_desc: ""
 skonester_world_ai_boost_pause_decision_tooltip: "Apparaît tant que le système de bonus est actif ; remplacé par l'option Reprendre après désactivation."
 skonester_world_ai_boost_pause_decision_confirm: "Désactiver les bonus de l'IA"
 skonester_world_ai_boost_pause_effect_tt: "Suspension globale active. Le menu des bonus IA reste masqué jusqu'à reprise manuelle."
 skonester_world_ai_boost_resume_decision: "Reprendre les bonus de domaine globaux de l'IA"
 skonester_world_ai_boost_resume_decision_desc: ""
 skonester_world_ai_boost_resume_decision_tooltip: "Visible uniquement lorsque tous les bonus de l'IA sont suspendus."
 skonester_world_ai_boost_resume_decision_confirm: "Réactiver les bonus de l'IA"
 skonester_world_ai_boost_resume_effect_tt: "Suspension levée ; les fonctions de renfort global de l'IA sont de nouveau disponibles."

 skonester_boost_world_ai_rulers_decision: "Autonomiser tous les domaines IA indépendants"
 skonester_boost_world_ai_rulers_decision_desc: "Accorder de pleins bonus militaires, économiques et diplomatiques à tous les seigneurs IA possessionnés pour alimenter l'expansion et la guerre. Si le joueur devient écrasamment dominant, les nations IA sont bien plus enclines à former des coalitions contre votre hégémonie pour un gameplay équilibré."
 skonester_boost_world_ai_rulers_decision_tooltip: "Bonus global non suspendu. #bold Aucun coût en prestige requis.#!"
 skonester_boost_world_ai_rulers_decision_confirm: "Activer le renfort complet de l'IA"
 skonester_boost_world_ai_rulers_effect_tt: "Tous les #bold dirigeants IA possessionnés#! reçoivent le modificateur Soutien à la gouvernance d'une durée de #bold 15#! ans, gagnant des avantages annuels de construction et d'hommes d'armes pendant toute la durée."

 skonester_ai_yearly_admin_conversion_toggle_title_on: "#bold 【ON】#! Déclencheur annuel : Réforme automatisée du gouvernement administratif de l'IA"
 skonester_ai_yearly_admin_conversion_toggle_title_off: "#bold 【OFF】#! Déclencheur annuel : Réforme automatisée du gouvernement administratif de l'IA"
 skonester_ai_yearly_admin_conversion_toggle_desc_on: "Actuellement activé. Nécessite Roads to Power (EP3). Chaque année, tous les IA possessionnés indépendants ainsi que leurs vassaux basculent automatiquement vers le gouvernement administratif. Activé par défaut, distinct de l'autonomisation manuelle de l'IA. Les suzerains nomades/tribaux/steppiques ne convertissent plus en masse leurs vassaux afin d'éviter des sécessions involontaires. Même après avoir désactivé cette option, les redevances vassaliques améliorées et les modificateurs d'expansion restent fonctionnels. Cliquez pour désactiver la conversion annuelle automatique du gouvernement."
 skonester_ai_yearly_admin_conversion_toggle_desc_off: "Actuellement désactivé. Le script annuel ne met plus à niveau les domaines IA vers le gouvernement administratif EP3. Les bonus d'obligations vassaliques et les buffs d'expansion annuels persistent ; la modification manuelle du gouvernement reste accessible via le menu politique. Cliquez pour réactiver la réforme annuelle automatisée."
 skonester_ai_yearly_admin_conversion_toggle_tooltip_on: "Actif : conversion administrative annuelle de l'IA (EP3 requis). Cliquez pour désactiver."
 skonester_ai_yearly_admin_conversion_toggle_tooltip_off: "Inactif : aucun basculement gouvernemental annuel automatisé pour l'IA. Cliquez pour activer."
 skonester_ai_yearly_admin_conversion_toggle_confirm_disable: "Désactiver la réforme administrative annuelle automatisée"
 skonester_ai_yearly_admin_conversion_toggle_confirm_enable: "Activer la réforme administrative annuelle automatisée"
 skonester_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "Désactivé : la conversion administrative annuelle automatisée pour l'IA est interrompue."
 skonester_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "Activé : les IA indépendantes qualifiées basculent annuellement vers le gouvernement administratif (prérequis EP3)."

 skonester_ai_yearly_pulse_toggle_title_on: "#bold 【ON】#! Impulsion annuelle globale (interrupteur principal)"
 skonester_ai_yearly_pulse_toggle_title_off: "#bold 【OFF】#! Impulsion annuelle globale (interrupteur principal)"
 skonester_ai_yearly_pulse_toggle_desc_on: "Défini sur activé par défaut. Tous les IA possessionnés indépendants reçoivent les bénéfices complets de l'impulsion annuelle : modificateurs d'expansion et de guerre, fiscalité vassalique relevée, rafraîchissement annuel de la coalition anti-hégémonie. Sous-options : conversion administrative activée par défaut, remaniement de jure des vassaux désactivé par défaut. La première année de campagne ignore entièrement l'impulsion complète. L'interrupteur principal désactivé masque toutes les sous-options et met fin aux scripts concernés. N'interagit pas avec le système de buffs mensuels automatiques de l'IA. Cliquez pour désactiver tout le système d'impulsion annuelle."
 skonester_ai_yearly_pulse_toggle_desc_off: "Actuellement désactivé. L'événement 9200 cesse de se déclencher ; le rafraîchissement annuel de la coalition anti-joueur propre au mod cesse (les vérifications trimestrielles/mensuelles ne sont pas affectées). Cliquez pour réactiver l'impulsion annuelle globale."
 skonester_ai_yearly_pulse_toggle_tooltip_on: "Actif par défaut, impulsion annuelle complète opérationnelle ; cliquez pour couper l'interrupteur principal."
 skonester_ai_yearly_pulse_toggle_tooltip_off: "Toutes les mécaniques d'impulsion annuelle suspendues ; cliquez pour activer l'interrupteur principal."
 skonester_ai_yearly_pulse_toggle_confirm_disable: "Désactiver l'interrupteur principal de l'impulsion annuelle"
 skonester_ai_yearly_pulse_toggle_confirm_enable: "Activer l'interrupteur principal de l'impulsion annuelle"
 skonester_ai_yearly_pulse_toggle_effect_disabled_tt: "Désactivé : l'événement 9200 et le rafraîchissement annuel de la coalition anti-hégémonie ne s'exécutent plus."
 skonester_ai_yearly_pulse_toggle_effect_enabled_tt: "Activé : l'impulsion annuelle s'exécute selon les configurations individuelles des sous-options."

 skonester_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【ON】#! Impulsion annuelle : Réaffectation de jure automatisée des vassaux de l'IA"
 skonester_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【OFF】#! Impulsion annuelle : Réaffectation de jure automatisée des vassaux de l'IA"
 skonester_ai_yearly_de_jure_transfer_toggle_desc_on: "Actuellement activé. L'IA indépendante exécute automatiquement la même restructuration de jure en masse des vassaux que celle disponible via les décisions du joueur, une fois par an. Modifie la disposition initiale des vassaux vanilla (Hexi, Gobi, etc.), désactivé par défaut. Le désactiver laisse intacts les buffs d'expansion, les surtaxes et la réforme administrative automatique ; les joueurs conservent la résolution manuelle du transfert de jure. Cliquez pour désactiver le remaniement de jure automatique de l'IA."
 skonester_ai_yearly_de_jure_transfer_toggle_desc_off: "Défini sur désactivé par défaut. L'impulsion annuelle ignore le réagencement légal des vassaux de l'IA afin de préserver les frontières initiales vanilla. Toutes les nouvelles campagnes ignorent entièrement l'impulsion annuelle de la première année. Cliquez pour activer le transfert de jure automatisé des vassaux."
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Actif : réaffectation de jure annuelle automatique de l'IA ; cliquez pour désactiver."
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Inactif par défaut : aucun décalage légal automatisé des vassaux ; cliquez pour activer."
 skonester_ai_yearly_de_jure_transfer_toggle_confirm_disable: "Désactiver la réaffectation de jure annuelle automatisée"
 skonester_ai_yearly_de_jure_transfer_toggle_confirm_enable: "Activer la réaffectation de jure annuelle automatisée"
 skonester_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "Désactivé : l'impulsion annuelle n'exécute plus la restructuration de jure automatisée des vassaux."
 skonester_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "Activé : les domaines IA indépendants subissent une réorganisation de jure annuelle de leurs vassaux."

 skonester_ai_boost_toggle_decision_title_on: "#bold 【ON】#! Renforcement passif mensuel de l'IA"
 skonester_ai_boost_toggle_decision_title_off: "#bold 【OFF】#! Renforcement passif mensuel de l'IA"
 skonester_ai_boost_toggle_decision_desc_on: "Buffs automatiques mensuels des statistiques de l'IA actifs. Jusqu'à 600 seigneurs IA possessionnés reçoivent chaque mois calendaire des bonus de domaine rayonnant depuis le domaine du joueur, se cumulant avec l'autonomisation manuelle en un clic de l'IA. Cliquez pour désactiver."
 skonester_ai_boost_toggle_decision_desc_off: "Amélioration passive mensuelle de l'IA inactive. Cliquez pour activer cette fonction, basculez à nouveau pour l'arrêter."
 skonester_ai_boost_toggle_decision_tooltip_on: "Auto-renfort en cours, cliquez pour suspendre les bonus mensuels."
 skonester_ai_boost_toggle_decision_tooltip_off: "Auto-renfort désactivé, cliquez pour démarrer les bonus mensuels."
 skonester_ai_boost_toggle_decision_confirm_disable: "Suspendre les buffs mensuels automatiques de l'IA"
 skonester_ai_boost_toggle_decision_confirm_enable: "Activer les bonus mensuels automatiques de l'IA"
 skonester_ai_boost_toggle_effect_enabled_tt: "Renfort mensuel de l'IA actif : max 600 IA possessionnées gagnent chaque mois des avantages nationaux rayonnant vers l'extérieur."
 skonester_ai_boost_toggle_effect_disabled_tt: "Renfort mensuel de l'IA suspendu : aucun bonus de statistiques passif supplémentaire appliqué automatiquement."

 skonester_ai_realm_governance_support: "Soutien à la gouvernance"
 skonester_ai_realm_governance_support_desc: "Environ 50 % de réduction de l'entretien de l'armée ; limite d'hommes d'armes et taille d'unité drastiquement augmentées. Vitesse de construction et revenu de domaine renforcés, ainsi qu'une meilleure diplomatie et une inclination belliqueuse accrue. L'IA gagne une cupidité plus élevée ainsi qu'une compassion et un honneur réduits ; limite de domaine +2. Tous les domaines indépendants obtiennent des bonus d'expansion annuels ainsi que des modificateurs de poussée cumulables, des redevances vassaliques élevées et des avantages administratifs EP3. Réaffectation de jure automatique permanente des vassaux activée."
 skonester_ai_expansion_push: "Poussée d'expansion annuelle"
 skonester_ai_expansion_push_desc: "Modificateur annuel du mod : ~60 % de construction plus rapide, ~70 % d'entretien des hommes d'armes moins cher. Oriente le désir de guerre, la rationalité et l'ambition de l'IA vers la poursuite de revendications plus volontiers, sans forcer de déclarations de guerre arbitraires."
 skonester_ai_stable_surge: "Poussée d'expansion annuelle majeure"
 skonester_ai_stable_surge_desc: "Bonus incrémental annuel à la bellicosité, l'audace, la rationalité et l'ambition de l'IA, se cumulant par-dessus la poussée d'expansion de base ; toutes les déclarations de guerre respectent la logique IA native du jeu de base inchangée."
 skonester_ai_counter_player_pressure: "Coalition anti-hégémonie"
 skonester_ai_counter_player_pressure_desc: "Déclenché si le joueur détient un titre d'empire ou règne sur plus de 80 comtés : tous les IA indépendants obtiennent des bonus temporaires de portée diplomatique, sociabilité, intrigue et bellicosité pour encourager la formation d'alliances contre une domination écrasante du joueur. Les déclarations de guerre, enlèvements et mariages royaux suivent les règles de calcul IA vanilla inchangées."
 skonester_ai_counter_player_pressure_heavy: "Contrer la domination du joueur (lourde)"
 skonester_ai_counter_player_pressure_heavy_desc: "Votre domaine a dépassé un seuil de taille critique : tous les IA reçoivent une diplomatie, une intrigue, une portée diplomatique et des poids de guerre/rancune plus forts, rendant les alliances contre un joueur dominant plus probables. Les décisions de l'IA suivent toujours les règles du moteur de base."
