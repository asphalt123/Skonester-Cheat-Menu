 skonester_cheat_menu_edit_resources_menu_interaction_desc: "Modifier l'or, le prestige, la piété, la limite de vassaux et d'autres ressources. Chaque icône correspond à un type de ressource."

 skonester_cheat_menu_set_realm_authority_interaction: "Autorité du domaine"
 skonester_cheat_menu_set_realm_authority_interaction_desc: "Définir les niveaux d'autorité du domaine I–IV, verrouiller l'autorité absolue ou effacer le statut de restauration."
 skonester_realm_auth_lock: "Verrouiller l'autorité absolue"
 skonester_realm_auth_lock_desc: "Définir définitivement l'autorité au palier maximal avec maintenance automatique (persiste à travers les mois, années, rechargements et successions)."
 skonester_realm_auth_clear: "Effacer le verrou d'autorité"
 skonester_realm_auth_clear_desc: "Retirer les effets de verrouillage et les modificateurs de sauvegarde. Réinitialiser les temps de recharge et les variables de restauration et désactiver la maintenance automatique."
 skonester_realm_authority_locked_holder: "Autorité verrouillée"
 skonester_realm_auth_must_be_independent_tt: "Seuls les dirigeants indépendants peuvent ajuster l'autorité du domaine. Les vassaux ne peuvent pas dépasser le palier d'autorité de leur suzerain."
 skonester_realm_auth_lv1: "Niveau I : Autorité limitée"
 skonester_realm_auth_lv2: "Niveau II : Autorité modérée"
 skonester_realm_auth_lv3: "Niveau III : Haute autorité"
