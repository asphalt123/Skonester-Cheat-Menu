 skonester_trait_immortal_ageless: "Immortel sans âge"
 skonester_trait_immortal_ageless_desc: "Le temps ne peut pas vous atteindre. Vous ne vieillissez pas, ne pouvez pas devenir infirme, possédez une forte résistance aux maladies et êtes presque immunisé contre le meurtre et les complots hostiles."
 skonester_trait_yannian_dan: "Élixir de longévité"
 skonester_trait_yannian_dan_desc: "Un élixir puissant qui préserve la jeunesse, prolonge la durée de vie et repousse la maladie."
 skonester_trait_yannian_dan_mid: "Élixir de longévité raffiné"
 skonester_trait_yannian_dan_mid_desc: "Un élixir raffiné qui préserve la jeunesse, prolonge grandement la durée de vie et repousse la maladie."
 skonester_trait_yannian_dan_best: "Élixir de longévité suprême"
 skonester_trait_yannian_dan_best_desc: "Un élixir sans égal qui défie le vieillissement mortel, accorde une vie prolongée et une protection totale contre la maladie."
 skonester_trait_baidubuqin: "Immunité au poison"
 skonester_trait_baidubuqin_desc: "Immunisé contre la maladie et la peste. Toutes les maladies existantes sont guéries en obtenant ce trait."
 skonester_trait_xinwuguai: "Tranquillité d'esprit"
 skonester_trait_xinwuguai_desc: "Votre esprit est libéré de tout fardeau. Le stress reste à zéro et ne s'accumule presque jamais. Tout le stress actuel est retiré à l'obtention."
 skonester_trait_marriage_ban: "Mariage restreint"
 skonester_trait_marriage_ban_desc: "Ne peut ni se marier ni être fiancé. Tous les mariages et fiançailles existants sont dissous. Réactivez ce trait pour retirer la restriction."
 skonester_trait_stats_100_locked: "Attributs maximisés (verrouillés)"
 skonester_trait_stats_100_locked_desc: "Tous les attributs de base et la Prouesse sont bloqués à 100. Aucun événement, vieillissement ou effet ne peut les modifier."

 trait_skonester_cheat_menu: "Trait spécial"
 trait_warlord_eternal: "Seigneur de guerre éternel"
 trait_warlord_eternal_desc: "Un maître de la guerre. Les troupes se battent plus durement, la vitesse de déplacement est fortement augmentée, les pénalités de terrain sont annulées et les sièges se terminent rapidement."
 trait_wealth_sovereign_max: "Souverain de la richesse"
 trait_wealth_sovereign_max_desc: "Maître du commerce et de la fiscalité. Le revenu, les contributions vassaliques et les réserves du trésor sont largement améliorés."
 trait_ultimate_intrigue_master: "Voyant mystique"
 trait_ultimate_intrigue_master_desc: "Sans égal dans les complots ténébreux. Les manigances ennemies contre vous échouent facilement, tandis que vos propres manigances restent cachées et réussissent presque toujours."
 trait_great_builder_god: "Bâtisseur divin"
 trait_great_builder_god_desc: "Maîtrise suprême de la construction. Les bâtiments et territoires du domaine sont construits à coût et en temps minimaux. Intendance, impôts, développement, fortifications et levées reçoivent tous d'énormes bonus."
 trait_nether_conspiracy_lord: "Seigneur de la conspiration des ténèbres"
 trait_nether_conspiracy_lord_desc: "Un grand maître de l'intrigue. Vos manigances sont plus discrètes et plus efficaces, tandis que les manigances ennemies sont ralenties et affaiblies. La Terreur augmente et l'opinion de la cour vous est favorable."
 trait_eternal_nether_lord: "Seigneur des ténèbres éternel"
 trait_eternal_nether_lord_desc: "Une présence d'ombre immortelle. Le stress a peu d'effet, la Terreur est immense, la puissance d'intrigue est accrue. Les manigances hostiles réussissent rarement, et vassaux et courtisans vous tiennent en admiration."
 trait_the_wake: "Traqueur des marais"
 trait_the_wake_desc: "Le summum des pillards des marais. Fort dans les zones humides et habile au pillage, mais méprisé par les cultures normandes."
 trait_lifestyle_traveler: "Vagabond"
 trait_lifestyle_traveler_desc: "Un trait à paliers issu du mode de vie Errance. Gagne en puissance grâce aux voyages, découvertes et périples à travers le domaine."
 trait_child_of_concubine_female: "Fille d'une concubine"
 trait_child_of_concubine_female_desc: "Née d'une concubine secondaire. Les lois de succession et de famille peuvent la traiter différemment des enfants légitimes."
 trait_child_of_concubine_male: "Fils d'une concubine"
 trait_child_of_concubine_male_desc: "Né d'une concubine secondaire. Les lois de succession et de famille peuvent le traiter différemment des enfants légitimes."
 trait_hajjaj: "Hajji"
 trait_shieldmaiden: "Vierge guerrière"
 trait_viking: "Pillard viking"

