 trait_warlord_god: "Dieu de cent batailles"
 trait_warlord_god_desc: "#bold Trait de triche#! pour les commandants. Augmente fortement [martial|e] et la #bold Prouesse#! ($game_concept_prowess$). Relève les limites de #bold chevaliers#! et leur efficacité au combat, renforce les dégâts et la résistance de l'#bold armée#! ainsi que la puissance de #bold siège#!. Octroie une #bold Terreur#! de base plus élevée, accélère le réapprovisionnement des #bold levées#! et réduit l'#bold entretien de l'armée#!. Les bonus de déplacement et de terrain sont accordés via des modificateurs de personnalité. #bold Non héréditaire#!. Exclu du Concepteur de dirigeant et des pools de traits aléatoires. N'accorde pas de drapeau de combat imbattable. Peut être appliqué en cliquant avec le bouton droit sur un personnage dans le menu principal de Skonester, ou via la commande : #bold add_trait = warlord_god#!. Ce trait se cumule séparément avec #bold Immortel céleste#!. Icône : #bold Heaume doré et épées croisées#! (thème [commander|e])."

