 skonester_cheat_menu_birth_cheat_menu_interaction_desc: "Créer des enfants doués pour vous-même ou un autre personnage"
 skonester_cheat_menu_sand_soldiers_interaction: "Invocateur d'unités"
 skonester_cheat_menu_sand_soldiers_interaction_desc: "Interface d'invocation d'armée : parcourez les hommes d'armes par classe d'unité. Clic gauche pour invoquer des unités pour la cible sélectionnée."
 skonester_cheat_menu_beauty_companion_interaction: "Compagnons charmants"
 skonester_cheat_menu_beauty_companion_interaction_desc: "Générer un conjoint ou compagnon exceptionnellement charismatique"

 skonester_cheat_menu_dissolve_domestic_factions_interaction: "Dissoudre les factions"
 skonester_cheat_menu_dissolve_domestic_factions_interaction_desc: "Dissoudre toutes les factions ciblant le personnage sélectionné. Les guerres de factions actives se termineront par une paix blanche. Tous les vassaux et courtisans quitteront les factions non combattantes restantes."
 skonester_cheat_menu_strong_deterrence_interaction: "Dissuader la rébellion"
 skonester_cheat_menu_strong_deterrence_interaction_desc: "Effet réutilisable de 5 ans. Les cibles ne peuvent pas rejoindre de factions ni vous déclarer la guerre pendant 5 ans. Appliquez à un seul vassal ou à tous les vassaux."
 skonester_strong_deterrence_target: "Ce vassal uniquement"
 skonester_strong_deterrence_all_vassals: "Tous les vassaux"
 skonester_strong_deterrence_must_be_vassal_tt: "La cible doit être un vassal ou sous-vassal vivant sous votre autorité."
 skonester_strong_deterrence_need_vassals_tt: "Vous devez avoir au moins un vassal vivant."
 skonester_strong_deterrence_toast_target_t: "Rébellion dissuadée"
 skonester_strong_deterrence_toast_target_desc: "[recipient.GetShortUIName] est dissuadé pendant 5 ans : ne peut pas former de factions ni vous déclarer la guerre."
 skonester_strong_deterrence_toast_all_t: "Tous les vassaux dissuadés"
 skonester_strong_deterrence_toast_all_desc: "Tous vos vassaux sont dissuadés pendant 5 ans : ils ne peuvent pas former de factions ni vous déclarer la guerre."

 skonester_cheat_menu_loyal_vassals_interaction: "Rendre les vassaux loyaux"
 skonester_cheat_menu_loyal_vassals_interaction_desc: "Usage personnel uniquement : tous les vassaux directs gagnent +999 d'opinion de vous et le trait Loyal."
 skonester_cheat_menu_loyal_vassals_must_be_ruler_tt: "Vous devez être un dirigeant possessionné pour utiliser cette option."
 skonester_loyal_vassals_toast_title: "Vassaux rendus loyaux"
 skonester_loyal_vassals_toast_desc: "Tous les vassaux ont reçu +999 d'opinion et le trait Loyal."
 skonester_cheat_menu_world_deterrence_interaction: "Dissuasion universelle"
 skonester_cheat_menu_world_deterrence_interaction_desc: "Bloquer votre Terreur à 100 de façon permanente. Tous les vassaux directs sont intimidés, ne peuvent pas rejoindre de factions contre vous et leur opinion de vous ne changera pas."
 skonester_cheat_menu_world_deterrence_must_be_ruler_tt: "Vous devez être un dirigeant possessionné pour utiliser cette option."
 skonester_world_deterrence_toast_title: "Dissuasion universelle"
 skonester_world_deterrence_toast_desc: "Terreur bloquée à 100. Tous les vassaux directs vous craignent, ne peuvent pas déclencher de rébellions de faction et leur opinion de vous est figée."
 skonester_world_deterrence_fear_opinion: "Craint votre puissance"
 skonester_world_deterrence_aura: "Dissuasion universelle"
 skonester_world_deterrence_aura_desc: "La Terreur est bloquée à 100 ; la décomposition est stoppée et la Terreur ne peut plus changer naturellement."

