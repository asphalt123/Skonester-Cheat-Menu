 skonester_official_land_cap_decision: "Consolider les titres"
 skonester_official_land_cap_decision_desc: "Forcer les vassaux de rang comtal et supérieur à ne conserver que leur titre principal et un comté ; les titres excédentaires retirés sont octroyés à d'autres dans le domaine — ils ne s'accumulent pas sur vous."
 skonester_official_land_cap_decision_tooltip: "Au moins un vassal du domaine détient encore des titres excédentaires."
 skonester_official_land_cap_decision_confirm: "Confirmer"
 skonester_official_land_cap_effect_tt: "Un clic réorganise tout le domaine : chaque vassal soumis aux limites foncières est traité immédiatement. Vous êtes notifié une fois terminé."
 skonester_land_cap_batch_complete_toast_title: "Consolidation des titres terminée"
 skonester_land_cap_batch_complete_toast_desc: "L'application de la limite foncière est terminée dans tout le domaine ; les titres excédentaires ont été octroyés et ne se sont pas accumulés sur vous."

 skonester_one_click_strip_official_titles_decision: "Saisie de titre en un clic"
 skonester_one_click_strip_official_titles_decision_desc: "Un seul clic lance des révocations de titres répétées jusqu'à leur achèvement : tous les comtés, duchés et titres de rang supérieur au sein de votre domaine vous reviennent."
 skonester_one_click_strip_official_titles_decision_tooltip: "Révoquer chaque titre de votre domaine, en vous les accordant directement."
 skonester_one_click_strip_official_titles_decision_confirm: "Confirmer la saisie"
 skonester_one_click_strip_official_titles_effect_tt: "Effectue automatiquement des révocations de titres successives jusqu'à ce qu'il ne reste plus de comtés, duchés ou titres supérieurs à revendiquer dans votre domaine. Les dirigeants étrangers indépendants ne sont pas affectés."

