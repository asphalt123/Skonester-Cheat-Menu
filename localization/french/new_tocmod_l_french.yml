l_french:
 # Base Traits
 trait_sneed_seed:0 "Le Sang des Dúnedain"
 trait_sneed_seed_desc:0 "Ce personnage possède le sang noble des Hommes de l'Ouest, lui accordant longévité et sagesse supérieures à celles de ses pairs."
 
 trait_gigasuperseed:0 "Le Sang de Númenor"
 trait_gigasuperseed_desc:0 "Ce personnage est un descendant des Hauts Númenóréens, portant le lignage pur de l'Ouestesse depuis les temps anciens."
 
 trait_greatest_lord_np:0 "Intendant du Domaine"
 trait_greatest_lord_np_desc:0 "Ce personnage détient l'autorité d'un Grand Intendant, régnant avec le mandat des Peuples Libres."
 
 trait_greatest_lord_t:0 "Seigneur des Hautes Maisons"
 trait_greatest_lord_t_desc:0 "Ce personnage descend des Grandes Maisons des Edain, inspirant le respect à tous les Hommes."
 
 trait_insane_generale:0 "Capitaine de l'Ouest"
 trait_insane_generale_desc:0 "Un chef de guerre légendaire dont l'éclat tactique est murmuré aussi bien au Gondor que dans les Terres de l'Ombre."

 trait_insane_opinion_fv:0 "Terreur des Neuf"
 trait_insane_opinion_fv_desc:0 "La réputation de ce personnage est si redoutable qu'elle glace le cœur des amis comme des ennemis."
 
 trait_insane_opinion_fa:0 "Ombre de l'Invisible"
 trait_insane_opinion_fa_desc:0 "Une présence qui impose une obéissance totale par la seule force d'une crainte accablante et d'une volonté de fer."

 trait_crazyminded_psycho:0 "La Souillure de Morgoth"
 trait_crazyminded_psycho_desc:0 "L'esprit du personnage est entaché par une antique obscurité, le poussant à des actes de cruauté et de folie extrêmes."
 
 trait_goodguy_toc:0 "Grâce des Valar"
 trait_goodguy_toc_desc:0 "Ce personnage a une disposition douce et paisible, comme béni par les puissances de l'Ouest."

 trait_pantokratorus_a:0 "Haut Roi"
 trait_pantokratorus_a_desc:0 "Ce personnage est marqué comme un Grand Conquérant et un Haut Roi de son temps."
 
 trait_borntorule_seed:0 "Héritier légitime d'Isildur"
 trait_borntorule_seed_desc:0 "Ce personnage est reconnu comme l'héritier légitime des royaumes d'antan."
 
 trait_pantokratorus_ablood:0 "Lignage des Rois"
 trait_pantokratorus_ablood_desc:0 "Ce personnage possède le lignage des rois anciens qui défièrent les premiers l'Ombre."

 # Custom Bloodlines
 trait_first_bloodline1:0 "Parent des Peuples Libres"
 trait_first_bloodline1_desc:0 "Un faible héritage transmis par le peuple de la Terre du Milieu, accordant une modeste augmentation de statut et de légitimité."
  
 trait_second_bloodline2:0 "Descendant des Hautes Maisons"
 trait_second_bloodline2_desc:0 "Un lignage reconnu portant la force et la vitalité des maisons nobles des Hommes."
  
 trait_third_bloodline3:0 "Héritage de l'Arnor"
 trait_third_bloodline3_desc:0 "Un lignage respecté dont le sang porte la compétence et la renommée du Royaume du Nord."
  
 trait_fourth_bloodline4:0 "Héritier de l'Ouestesse"
 trait_fourth_bloodline4_desc:0 "Un puissant héritage des Rois de la Mer, admiré par la parenté comme par les vassaux pour son autorité innée."
  
 trait_fifth_bloodline5:0 "Le Sang d'Elendil"
 trait_fifth_bloodline5_desc:0 "Un lignage exalté du plus haut rang, accordant des bonus écrasants à la capacité, à la vitalité et à la renommée dynastique."

 trait_toc_patrilinealblood:0 "Lignée ancestrale des Pères"
 trait_toc_patrilinealblood_desc:0 "Un lignage paternel reconnu par le sang et l'autorité des maisons anciennes."
  
 trait_toc_patrilinealblood2:0 "Héritage paternel souverain"
 trait_toc_patrilinealblood2_desc:0 "Un lignage paternel plus fort, portant le prestige et l'autorité d'une dynastie régnante."
  
 trait_toc_patrilinealblood3:0 "Maison éternelle de l'Ouest"
 trait_toc_patrilinealblood3_desc:0 "Un lignage paternel dominant, accordant une vitalité durable et le droit à un règne légitime à travers les âges."

 # Special Traits
 trait_toc_gamerblood0:0 "Murmures d'Orthanc"
 trait_toc_gamerblood0_desc:0 "Ce personnage possède un lignage marqué par la ruse et la manipulation des grands intrigants."
 
 trait_toc_gamer0:0 "Maître de la Tromperie"
 trait_toc_gamer0_desc:0 "Accorde d'énormes bonus d'intrigue et de réussite de manigance, rivalisant avec la langue subtile de Saruman."
 
 trait_toc_immortalblood:0 "Étincelle des Ainur"
 trait_toc_immortalblood_desc:0 "Ce personnage possède le lignage des Immortels, un pont entre le monde visible et l'invisible."
 
 trait_toc_immortal:0 "Esprit immortel"
 trait_toc_immortal_desc:0 "Ce personnage est lié aux cercles du monde et ne peut mourir de vieillesse ou de maladie."

