 toc_stabilizeland_modifier_desc:0 "Augmente le contrôle et la stabilité de la province."
 
 toc_cityland_modifier:0 "Cité mineure"
 toc_cityland_modifier_desc:0 "Augmente les taxes locales et le développement."
 
 toc_bigcityland_modifier:0 "Grande cité"
 toc_bigcityland_modifier_desc:0 "Augmente fortement les taxes locales et le développement."
 
 toc_imperialcityland_modifier:0 "Capitale impériale"
