 toc_hordeland_modifier:0 "Campement de horde"
 toc_hordeland_modifier_desc:0 "Augmente les levées et le taux de renfort."
 
 toc_grandwallland_modifier:0 "Défenses maximales"
 toc_grandwallland_modifier_desc:0 "Augmente massivement le niveau de fort et la taille de la garnison."
 
 toc_allfiefs_modifier:0 "Domaine et vassaux illimités"
 toc_allfiefs_modifier_desc:0 "Supprime les pénalités de limite de domaine et de vassaux."


