l_french:
 skonester_clavius_grail_name:0 "Graal de la Sentinelle éternelle"
 skonester_clavius_grail_description:0 "La coupe confiée au tribun Clavius Aquila, dont les humbles origines demeurent cachées sous les offrandes d'innombrables générations. Avant que sa longue veille ne s'achève, Clavius la plaça entre les mains de son successeur. C'est un serment de protéger les vivants avec la patience de celui que la mort ne saurait plus hâter."
 skonester_clavius_grail_modifier:0 "La dernière charge de Clavius"
 skonester_clavius_grail_modifier_desc:0 "La coupe du tribun appelle son gardien à la sagesse, à la dévotion et à la justice envers chaque sujet."
 skonester_clavius_handover_memory:0 "La dernière veille de Clavius"
 skonester_clavius_handover_memory_desc:0 "J'ai bu au Graal de Clavius Aquila et accepté sa charge de Sentinelle éternelle. Enfin, la longue veille du tribun prit fin."
 skonester_clavius_handover_memory_desc_second_perspective:0 "Vous avez bu au Graal de Clavius Aquila et accepté sa charge de Sentinelle éternelle. Enfin, la longue veille du tribun prit fin."
 skonester_clavius_handover_memory_desc_third_perspective:0 "Ce personnage a bu au Graal de Clavius Aquila et accepté sa charge de Sentinelle éternelle. Enfin, la longue veille du tribun prit fin."
