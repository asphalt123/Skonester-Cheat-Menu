l_french:
  char_spawner.t:1 "Menu d'invocation de personnage"
  char_spawner.d:0 "Invoquez n'importe quel personnage dont vous avez besoin. Vous pouvez choisir le nombre souhaité ci-dessus."
  char_spawner.numb.t:1 "Choisir la quantité à invoquer"
  char_spawner.numb.d:0 "Choisissez le nombre de personnages à invoquer. S'applique à tous les éléments du menu, sauf les conseillers."
  char_spawner.councillors.t:1 "Invoquer des membres du cabinet"
  char_spawner.councillors.d:0 "Ces membres du cabinet seront invoqués directement à leurs postes respectifs."
  char_spawner.heirs.t:1 "Invoquer des héritiers"
  char_spawner.heirs.d:0 "Dans ce menu, vous pouvez choisir parmi trois types d'héritiers : Excellent, Normal et Minable. Vous pouvez aussi sélectionner le sexe et l'âge de l'enfant."
