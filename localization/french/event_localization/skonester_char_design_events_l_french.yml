 sarc_char_design.dyn.choice.event.t:1 "Choix de dynastie"
 sarc_char_design.dyn.choice.event.d:0 " Choisissez entre tuer les membres de votre dynastie ou simplement ajouter le trait de déshérité à certains d'entre eux.\n\n Cela sert à garantir que votre personnage hérite des titres du dirigeant.\n\n Les tuer donne l'impression de partir d'une dynastie presque vide, tandis que déshériter certains laisse la dynastie en grande partie intacte.\n\n Je suggère l'option de déshéritage en multijoueur, pour éviter que le nettoyage de la dynastie ne touche les autres joueurs."

