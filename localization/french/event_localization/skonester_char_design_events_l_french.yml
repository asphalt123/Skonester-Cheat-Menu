 sarc_char_design.2001.t:1 "Genre"
 sarc_char_design.2001.desc:0 "Sélectionnez le genre de votre dirigeant."
 
 sarc_char_design.1001.t:1 "Invite du concepteur de personnage"
 sarc_char_design.1001.desc.5:0 "Voulez-vous concevoir un dirigeant personnalisé ? (AVERTISSEMENT : élimine votre dynastie proche ou la déshérite, et votre dirigeant actuel meurt dès que vous terminez la création.) (Après avoir choisi l'âge de votre personnage, celui-ci est créé avec 5 dans toutes les compétences. Ce personnage créé est assigné comme fils de votre dirigeant actuel.)"
 sarc_char_design.1001.desc.10:0 "Voulez-vous concevoir un dirigeant personnalisé ? (AVERTISSEMENT : élimine votre dynastie proche ou la déshérite, et votre dirigeant actuel meurt dès que vous terminez la création.) (Après avoir choisi l'âge de votre personnage, celui-ci est créé avec 10 dans toutes les compétences. Ce personnage créé est assigné comme fils de votre dirigeant actuel.)"
 
 sarc_char_design.1002.t:1 "Tranche d'âge"
 sarc_char_design.1002.desc:0 "Sélectionnez la tranche d'âge de votre personnage personnalisé. Vous ne pouvez choisir que des âges inférieurs à celui du dirigeant actuel."
 
 sarc_char_design.age.event.t:1 "Âge"
 sarc_char_design.age.event.d:0 "Sélectionnez l'âge de votre personnage personnalisé."
 
 sarc_char_design.skill.event.t:1 "Compétences"
 sarc_char_design.skill.event.d.5:0 "Sélectionnez une compétence pour en modifier la valeur. Toutes les compétences du personnage personnalisé ont démarré à 5. Les changements de compétences n'apparaissent qu'après un jour écoulé, mais vous pouvez survoler le score de la caractéristique dans l'écran du personnage pour obtenir un montant exact."
 sarc_char_design.skill.event.d.10:0 "Sélectionnez une compétence pour en modifier la valeur. Toutes les compétences du personnage personnalisé ont démarré à 10. Les changements de compétences n'apparaissent qu'après un jour écoulé, mais vous pouvez survoler le score de la caractéristique dans l'écran du personnage pour obtenir un montant exact."
 
