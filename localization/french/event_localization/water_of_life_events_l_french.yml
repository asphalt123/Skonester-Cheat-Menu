l_french:
 water_of_life_header:0 "Le journal du centurion :"
 water_of_life.1001.t:0 "$water_of_life_header$ L'homme qui ne mourut pas."
 water_of_life.1001.desc:0 "Le parchemin n'était pas caché dans une bibliothèque, mais dans la garde d'un glaive rouillé trouvé en Judée. Le latin en est rude, militaire : le rapport d'un tribun nommé Clavius. Il y est question d'un corps disparu d'un tombeau scellé, d'une femme aux cheveux roux qui connaissait la vérité, et d'une coupe qui arrête l'horloge de la vie.\n\nLa dernière entrée n'est pas une date, mais un serment : #'Je ne puis tuer ce qui ne peut mourir. Je ne puis que le servir. Je gagne le désert pour monter la garde.'#!\n\nLes légendes disent qu'il y est encore. Un soldat qui attend la relève. Si je le trouve, je trouve le Graal."
 water_of_life.1001.a:0 "Je préparerai mon corps pour la piste du tribun."
 water_of_life.1001.b:0 "J'étudierai son journal avant de partir."

 water_of_life_header_1:0 "La poursuite :"
 water_of_life.1002.t:1 "$water_of_life_header_1$ L'ombre de l'aigle."
 water_of_life.1002.desc:0 "Je laisse ma couronne derrière moi. Pour retrouver Clavius, je dois suivre le chemin de l'exilé. J'échange mon velours contre de la laine, mon sceptre contre un bâton de marche. Les indices de son journal m'éloignent des cités des hommes, vers les lieux silencieux où l'emprise de l'Empire s'est effondrée. Je piste un fantôme qui a eu des siècles pour brouiller ses traces."
 water_of_life.1002.a:0 "La route est longue, mais ma volonté est de fer."
 water_of_life.1002.b:0 "Un dernier regard sur mon domaine, puis je disparais."

 water_of_life_header_2:0 "Le désert :"
 water_of_life.1003.t:1 "$water_of_life_header_2$ Les sept puissances."
 water_of_life.1003.desc:0 "Le désert dépouille un [ROOT.Char.GetWomanMan] jusqu'à l'os. Comme l'avertit l'*Évangile de Marie*, l'âme est assaillie par les sept puissances de la Colère : les Ténèbres, le Désir et l'Ignorance. Seul près du feu, je les combats. Je ne crains pas les bandits ; je crains le silence où Clavius trouva son Dieu. Mon esprit — le *Nous* — doit devenir aussi immobile qu'un tombeau avant que la pierre ne soit roulée."
 water_of_life.1003.a:0 "Je dompte l'envie de faire demi-tour."

 water_of_life_header_3:0 "Épreuve d'endurance :"
 water_of_life.1004.t:1 "$water_of_life_header_3$ La ration du soldat."
 water_of_life.1004.desc:0 "Les vivres s'épuisent. Le paysage n'est que roche implacable et épines. Je comprends maintenant pourquoi il a choisi ce lieu : c'est une forteresse faite de nature. La faim me tenaille. Dois-je chasser en seigneur, ou mendier en pèlerin ? Le tribun respecterait la discipline, mais la Madeleine enseigna l'humilité."
 water_of_life.1004.a:0 "Je chasserai. La discipline soutient le corps."
 water_of_life.1004.b:0 "Je chercherai les habitants. L'humilité soutient l'âme."

 water_of_life_header_4:0 "La chasse :"
 water_of_life.1005.t:1 "$water_of_life_header_4$ Les signes de la Légion."
 water_of_life.1005.desc:0 "Je trouve un repère : un cairn de pierres empilées avec une précision militaire. Puis un autre. Je n'erre pas ; je suis guidé. Ou peut-être... mené comme un troupeau. Près d'un ruisseau, j'aperçois un cerf. Il ne fuit pas. Il m'observe, sans crainte, comme s'il était sous la protection d'un puissant gardien. Je retiens mon tir. Tuer ici me semble une violation d'une Trêve.\n\nAu cairn, je trouve un fragment érodé de l'Évangile secret. Je l'enveloppe avec soin : un témoignage à rapporter chez moi, et un rappel de la retenue que ce lieu exige."
 water_of_life.1005.a:0 "Je baisse mon arc. Je suis ici un invité."

 water_of_life_header_5:0 "Le village :"
 water_of_life.1006.t:1 "$water_of_life_header_5$ Le vieil homme des collines."
 water_of_life.1006.desc:0 "Un petit hameau s'accroche au flanc de la montagne. Quand j'interroge sur le Romain, les villageois font le signe du poisson. Un ancien murmure : « L'Étranger ? Il est ici depuis le grand-père de mon grand-père. Il porte le fer de l'ancien monde. Il nous protège des loups et des bandits, mais il ne parle jamais. Il attend quelqu'un. » L'ancien me regarde. « Peut-être vous. »\n\nIl m'offre des provisions pour la route. En échange de mon paiement et de la promesse d'un passage sûr pour les marchands de son village, ils apporteront leur commerce dans mes terres."
 water_of_life.1006.a:0 "Je paierai les provisions et j'accueillerai vos marchands."

 water_of_life_header_6:0 "L'approche :"
 water_of_life.1007.t:1 "$water_of_life_header_6$ La dixième Légion."
 water_of_life.1007.desc:0 "Le sentier se rétrécit en un chemin de chèvres menant à l'entrée d'une grotte fortifiée de pierres anciennes. Je sens des yeux posés sur moi : le poids d'un regard qui a vu des empires s'élever et tomber en poussière. Je m'arrête et lève mes mains vides. « Tribun ! » m'écrié-je. « Je cherche le Vivant ! » \n\nLe silence me répond. Puis, le grondement de la pierre."
 water_of_life.1007.a:0 "Entrer dans la tanière du lion."

 water_of_life_header_8:0 "Le tribun :"
 water_of_life.1008.t:1 "$water_of_life_header_8$ Clavius Aquila."
 water_of_life.1008.desc:0 "Il est assis près d'un feu modeste, nettoyant un glaive qui brille encore comme neuf. Il porte la tunique d'un tribun romain, bien que le cuir soit usé jusqu'à la corde par les éons. Clavius lève les yeux, le regard chargé de mille ans de souvenirs.\n\n« J'ai vu deux choses qui ne peuvent se concilier, » dit-il, d'une voix de gravier. « Un homme mort sans conteste, et ce même homme à nouveau vivant. J'ai promis à Marie de monter la garde jusqu'à l'arrivée d'un héritier digne. »\n\nIl fixe longuement les flammes. « J'ai conseillé bien des rois. J'ai été aux côtés du roi lépreux, Baudouin, lorsqu'il ordonna : #P *\"Ne maltraitez ni le Juif ni le Musulman. En ce Royaume, il n'y a pas de race, seulement des sujets de Dieu.\"*#! Tu dois désormais porter cette justice. »\n\nIl tend une simple coupe d'argile, désormais incrustée de joyaux au fil des siècles. « L'*Évangile* dit : *La matière donna naissance à une passion sans égale.* Bois, et la passion meurt. Seul le devoir demeure. Es-tu prêt à prendre ma relève, [ROOT.GetCharacter.GetTitledFirstNameNoTooltip] ? »\n\nPrès de la coupe se trouve un rouleau de noms : les maisons qui ont fourni des soldats à sa garde. Clavius le place entre mes mains. « Ils répondront désormais à ton appel. Garde la foi avec eux. »\n\nLe Graal lui-même m'appartient désormais, témoin durable du serment que je suis sur le point de prêter."
 water_of_life.1008.a:0 "« Je vous relève, tribun. Allez vous reposer. »"

 water_of_life_header_9:0 "Le retour :"
 water_of_life.1009.t:1 "$water_of_life_header_9$ La nouvelle sentinelle."
 water_of_life.1009.desc:0 "Clavius se changea en poussière à l'instant où la coupe toucha mes lèvres — enfin en paix. Je retourne dans mon domaine portant son fardeau et Son sang. Mes sujets acclament, mais ils ne comprennent pas. Ils voient un dirigeant ; je vois la nature éphémère de la chair. \n\n[one_loyal_subject_character.GetFirstNameNoTooltip] : Mon [ROOT.Char.GetLadyLord], vous êtes revenu ! \n\n[second_loyal_subject_character.GetFirstNameNoTooltip] : Nous craignions que vous ne soyez perdu dans les terres sauvages ! \n\n[third_loyal_subject_character.GetFirstNameNoTooltip] : Vous semblez... terriblement calme. \n\n[fourth_loyal_subject_character.GetFirstNameNoTooltip] : Bienvenue chez vous, Gardien."
 water_of_life.1009.a:0 "Tenez-vous à mes côtés. Notre garde commence."

 water_of_life.1003.martial_preparation:0 "\n\nLa discipline que j'ai pratiquée avant de partir affermit mon pas. Je lis le terrain comme le ferait un soldat, ménageant mes forces pour l'ascension à venir."
 water_of_life.1003.scholarly_preparation:0 "\n\nLes heures passées à étudier le journal de Clavius portent leurs fruits. Ses mots donnent forme au silence, et je commence à comprendre pourquoi il a choisi ce désert."
